name: Portal verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - run: npm run build
      - name: Test generated quality gate
        run: python3 -m unittest discover -s tests -p test_generated_quality.py -q
      - name: Check generated HTML and local links
        run: >-
          python3 scripts/check_generated_quality.py
          --bootstrap --root dist
          --tools "${{ runner.temp }}/afeiii-quality-tools"
          --baseline scripts/quality-baseline.json
          --output "${{ runner.temp }}/portal-quality.json"
